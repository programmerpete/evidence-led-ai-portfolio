[project]
name = "evidence-led-investigation"
version = "0.1.0"
description = "Synthetic financial-crime investigation portfolio lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1,<2"]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
