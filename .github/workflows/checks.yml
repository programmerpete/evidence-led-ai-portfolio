name: Portfolio checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.11"
      - run: uv sync --locked --extra ml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://portfolio:synthetic-ci-only@localhost:5432/portfolio_test
      - run: uv run --extra ml python fraud_signals.py
